[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wearformer"
version = "0.1.0"
description = "Joint imputation of wearable heart-rate measurements and step counts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "torch>=2.8,<3",
]

[project.optional-dependencies]
baselines = ["pypots==1.5", "scikit-learn>=1.7,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["wearformer*", "preprocessing*", "baselines*", "experiments*", "confidence*", "downstream*"]
